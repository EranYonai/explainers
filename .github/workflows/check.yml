name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build and check every example and starter
        run: npm run check
      - name: Regenerate the theme gallery and the themes the skill ships
        run: python3 -B docs/themes/build.py
      - name: Committed pages and themes match a fresh build
        run: git diff --exit-code -- examples docs/themes skills/explainer/themes
