# "How an explainer gets made", with git bisect as the worked example.
# Written as if a compiler existed. It does not: index.html is hand-written.
# Anything not in the plan's bisect example is marked  # NEW:
# NEW: an action that carries text is a one-key map ({ fill x: "text" }) so the file stays valid YAML.

page: how-an-explainer-gets-made
theme: ink
# NEW: page-level skeleton borrowed from short-form reels. The compiler would set
# `hook` and `payoff` in display type and check that the payoff answers the hook.
hook: "One commit in 1,000 broke the build. How does git find it in ten tests?"
payoff: "Every test halves what is left. 1,000 commits, 10 tests."

scenes:

  # ---- 1. The interview --------------------------------------------------
  - scene: interview
    objects:
      - chat:  { id: talk, speakers: [ai, you], show: latest-exchange }   # NEW: chat primitive
      - card:  { id: brief, rows: [reader, the aha, misconception to break, leave out] }  # NEW: card with fillable rows
    steps:
      - say: The reader goes into the brief first. It decides what can be skipped.
        do:
          - ai: Who is the reader, and what do they already know?
          - you: Engineers who use git every day and have never run bisect.
          - fill brief.reader: Uses git daily. Has never run bisect.
      - say: One aha per explainer. Every later choice serves it.
        do:
          - ai: What should click for them by the end?
          - you: Each test throws away half of the suspects. A thousand commits takes about ten tests.
          - fill brief.the aha: Each test clears half of the suspects.
      - say: Naming the misconception tells the AI what the hook must contradict.
        do:
          - ai: Which wrong idea should break?
          - you: That finding a regression means reading diffs, or checking commits one at a time.
          - fill brief.misconception to break: Finding a regression means reading diffs.
      - say: Scope is the last line. It keeps the piece short.
        do:
          - ai: What can I leave out?
          - you: Merges and how git picks the midpoint in a branching history. One line on flaky tests is enough.
          - fill brief.leave out: Merges and bisect internals.
      - say: Four answers, four lines. Only now does the AI start on the story.
        do:
          - ai: That is the brief. I have not drawn anything yet. Next I will propose the story in four beats.

  # ---- 2. Beats, then storyboard ----------------------------------------
  - scene: beats-and-storyboard
    objects:
      - slots:  { id: outline, names: [hook, intuition, mechanism, payoff] }   # NEW: named slots that cards fall into
      - sketch: { in: outline.hook,      id: sk1, src: stills/hook.svg,      style: rough }  # NEW: rough = feTurbulence wobble
      - sketch: { in: outline.intuition, id: sk2, src: stills/halving.svg,   style: rough }
      - sketch: { in: outline.mechanism, id: sk3, src: stills/probe-16.svg,  style: rough }
      - sketch: { in: outline.payoff,    id: sk4, src: stills/culprit.svg,   style: rough }
      - note:   { id: react, on: outline }                                    # NEW: margin note with a speaker
    initial: [hide sk1..sk4, hide react]                                      # NEW: initial state outside the steps
    steps:
      - say: "Hook: a situation the reader has lived through."
        do: [{ fill outline.hook: "Nightly is red. It was green last week. Which commit did it?" }]
      - say: "Intuition: the idea in one sentence, before any mechanics."
        do: [{ fill outline.intuition: "Each test can clear half of the suspects." }]
      - say: "Mechanism: the procedure, small enough to follow by eye."
        do: [{ fill outline.mechanism: "Test the middle. Keep the half that still hides the bug. Repeat." }]
      - say: "Payoff: the number that makes it worth learning. You approve the outline here."
        do: [{ fill outline.payoff: "Three tests for seven suspects. About ten for a thousand." }]
      - say: "Storyboard: one rough still per beat. Wobbly on purpose, so nobody gets attached."
        do: [show sk1..sk4]
      - say: You react. Sixteen commits will be unreadable on a phone.
        do: [flag outline.mechanism, { note react you: "Too many dots in the mechanism still. Use 8 commits so it reads on a phone." }]
      - say: The still is redrawn with eight. Changing it cost one sentence.
        do: [swap sk3 stills/probe-8.svg, { note react ai: "Redrawn with 8 commits. The other three stills are unchanged." }]   # NEW: swap

  # ---- 3. States, not animations ----------------------------------------
  # The scene shows its own source. `source-of` is the only new thing; the inner
  # scene is the plan's bisect example with shorter captions.
  - scene: file-next-to-render
    objects:
      - source: { id: file, of: git-bisect, highlight: active-step }   # NEW: code view bound to another scene's steps
      - embed:  { id: out,  scene: git-bisect }                         # NEW: scene inside a scene, steps linked
    steps: follow git-bisect                                            # NEW: step list inherited from the embedded scene

  - scene: git-bisect
    objects:
      - commits: { id: log, count: 8 }
      - pointer: { id: probe, on: log, label: test }
      - range:   { id: suspects, on: log }
    steps:
      - say: Green at c1, red at c8.
        do: [good c1, bad c8, suspects c2..c8]
      - say: Test the middle commit.
        do: [move probe c4]
      - say: c4 passes. The bug came later.
        do: [good c2..c4, suspects c5..c8]
      - say: Test the middle of the rest.
        do: [move probe c6]
      - say: c6 fails. It is c5 or c6.
        do: [bad c6..c7, suspects c5..c6]
      - say: One more test.
        do: [move probe c5]
      - say: c5 fails. First bad commit.
        do: [bad c5, culprit c5, hide probe]

  # ---- 4. The AI catches itself -----------------------------------------
  - scene: self-check
    objects:
      - frame:  { id: f7, of: git-bisect, step: 7, patch: { step-7: [bad c5, culprit c5] } }  # NEW: frozen frame of another scene, with a deliberately broken patch
      - lint:   { id: boxes, on: f7, rule: label-overlap }   # NEW: draws the checker's own measurements; number is computed, never typed
      - log:    { id: report }                               # NEW: terminal lines that accumulate
      - diff:   { id: fix, file: git-bisect, step: 7 }       # NEW
    steps:
      - say: The last frame as first generated. The pointer is still on c5, under the new label.
        do: [{ log report: "$ ex frames bisect.scene.yaml" }, { log report: "7 frames written" }]
      - say: The check measures every label's box and flags any two that intersect.
        do: [show boxes, { log report: "{boxes.message}" }]       # NEW: interpolation from a computed value
      - say: The cause is in the file. The last step never hid the pointer. One state was missing.
        do: [{ show fix: { del: "do: [bad c5, culprit c5]", add: "do: [bad c5, culprit c5, hide probe]" } }]
      - say: Re-rendered. The frame is clean and the check passes. You never saw the broken version.
        do: [unpatch f7, hide boxes, { log report: "7 frames written, 0 overlaps" }]

  # ---- 5. The finished piece: bisect as a trace --------------------------
  - scene: bisect-live
    objects:
      - commits: { id: log, count: 8 }
      - pointer: { id: probe, on: log, label: test }
      - range:   { id: suspects, on: log }
      - term:    { id: cmd }                                 # NEW: one-line command strip
      - choice:  { id: culprit, label: Hide the bug in, options: c2..c8, default: c5 }  # NEW: reader input that re-runs the trace
    steps:
      # setup: two frames of common knowledge, hand-written
      - say: Green at c1, red at c8. One of c2 to c8 introduced the bug.
        do: [good c1, bad c8, suspects c2..c8, { cmd: "git bisect start c8 c1" }]
      - say: "The obvious way: test c2, then c3, then c4. That could take six runs."
        do: [move probe c2]
      # mechanism: generated
      - trace:
          run: traces/bisect.js          # exports bisect(lo, hi, isBad) and emits events
          args: { good: c1, bad: c8, first_bad: $culprit }
          on:                             # NEW: map trace events to states + caption templates
            probe:  { say: "Test {mid}, the middle of what is left.", do: ["move probe {mid}"], cmd: "./test.sh" }
            passed: { say: "{mid} passes. Everything up to {mid} is cleared.", do: ["good ..{mid}", "suspects {lo+1}..{hi}"], cmd: "git bisect good" }
            failed: { say: "{mid} fails. The bug is in {mid} or earlier.",   do: ["bad {mid}..", "suspects {lo+1}..{hi}"], cmd: "git bisect bad" }
            done:   { say: "{hi} is the first bad commit, found in {tests} tests.", do: ["culprit {hi}", hide probe] }

  # ---- component: cost of the search -------------------------------------
  - component: search-cost               # JS escape hatch, typed params
    src: components/search-cost.js
    params:
      k: { type: int, min: 1, max: 20, default: 3, slider: "Suspect commits", display: "2^k" }  # NEW: display transform
    # draws two bars: one by one (2^k - 1 tests) and bisect (k tests)
