# Why a flaky test lies: scene source, written as if the compiler existed.
# Consistent with bisect.scene.yaml: `scene`, `objects`, `steps` with `say` + `do`.
# Anything not in the bisect example is marked  # NEW:

page: flaky-test                       # NEW: a page holds several scenes plus beats (hook / payoff)
title: Why a flaky test lies
theme: ink

hook: Why did the same test pass, then fail, with no code change?        # NEW: big-type opener, first frame of a reel
payoff: The code never changed. The timing did, and the test was measuring the timing.   # NEW: big-type closer

scenes:

# ---------------------------------------------------------------------------
# Scene 1. STATES layer. Two runs of one test on a shared timeline.
# ---------------------------------------------------------------------------
- scene: two-runs
  objects:
    - timeline: { id: tl, unit: ms, range: [0, 80], ticks: 20, lanes: [test, worker] }   # NEW: timeline primitive
    - cursor:   { id: now, on: tl, at: 0, label: "now: {at} ms" }                        # NEW: numeric, tweened by the engine
    - span:     { id: sleep, on: tl.test,   from: 0, to: 50, label: "sleep(50 ms)", fill: to-cursor, ghost: true }
    #            NEW: `fill: to-cursor` draws the span only up to `now`; `ghost` shows the planned extent dashed
    - marker:   { id: assert, on: tl.test, at: 50, shape: diamond, label: assert, drop-line: true }
    - span:     { id: save, on: tl.worker, from: 0, to: 40, label: "save(order)", fill: to-cursor }
    - cell:     { id: saved, label: order.saved, value: false }
    - cell:     { id: read,  label: "test read at 50 ms", value: not yet }
    - stamp:    { id: verdict }                                                          # NEW: PASS / FAIL stamp
    - title:    { id: run, text: "Run 1" }
  steps:
    - say: The test hands the save to a worker thread, then sleeps 50 ms. saved is false.
      do: [now 0]
    - say: Two threads now run side by side. One sleeps. One saves.
      do: [now 20]
    - say: "40 ms: the worker finishes and writes saved = true."
      do: [now 40, set saved true, flash saved]
    - say: "50 ms: the test wakes and reads saved. It sees true. Pass."
      do: [now 50, set read true, good assert, stamp verdict PASS, flash read]
    - say: Run 2. Same commit. Same test. Same machine.
      do:
        - reset                               # NEW: back to the objects' declared state, as a cut (no tween)
        - 'set run "Run 2 · same code"' 
        - reshape: { id: save, segments: [[0, 15], [37, 62]], paused: [[15, 37]] }   # NEW: a span with gaps
    - say: This time the scheduler pauses the worker for 22 ms. Something else needed the CPU.
      do: [now 37]
    - say: "50 ms: the test wakes and reads saved. The worker is still busy. It sees false. Fail."
      do: [now 50, set read false, bad assert, stamp verdict FAIL, flash read]
    - say: 12 ms later the worker writes true. The save worked. The test had already said it failed.
      do: [now 62, set saved true, flash saved]
  check:                                      # NEW: invariants the validator runs on every step
    - saved.value == (now.at >= save.to)      # catches a caption/state that disagrees with the timeline
    - read.value == "not yet" or now.at >= assert.at

# ---------------------------------------------------------------------------
# Scene 2. COMPONENTS layer. 200 replays with random jitter.
# The component draws ONLY the dot plot. Sliders, readouts, run grid and
# captions are engine primitives wired to it from here.
# ---------------------------------------------------------------------------
- scene: replay
  component:                                  # NEW: whole block
    id: sim
    use: ./components/jitter-replay.js        # exports { params, outputs, mount(el) -> { update(params) -> outputs } }
    params:                                   # checked against the types the JS file declares
      work_ms:   40                           # number(ms)   literal
      sleep_ms:  { bind: sleep }              # number(ms)   bound to a control
      jitter_ms: { bind: jitter }             # number(ms)
      wait:      { bind: wait }               # enum [sleep, join]
      runs:      200                          # int
      seed:      11                           # int   same seed + same params = same picture, on web, in frames, in MP4
      progress:  1                            # number 0..1   share of runs replayed so far; the engine can tween it
  controls:                                   # NEW: engine-rendered inputs; each has an id that `bind` and `set` use
    - slider: { id: jitter, label: Scheduling jitter,        min: 0,  max: 20,  step: 0.5, value: 3,  unit: ms }
    - slider: { id: sleep,  label: Sleep before the assert,  min: 45, max: 100, step: 5,   value: 50, unit: ms,
                disabled-when: wait == join }
    - choice: { id: wait,   label: How the test waits, value: sleep,
                options: { sleep: Fixed sleep, join: Wait for worker } }
    - button: { id: again,  label: Run 200 more, do: [inc sim.seed, tween sim.progress 0 1 2.6s] }
  objects:                                    # ordinary primitives fed by component OUTPUTS
    - stat:     { label: Failed runs,         value: "{sim.failed} / {sim.shown}", sub: "{sim.rate | pct} flake rate" }
    - stat:     { label: Red after 2 retries, value: "{sim.red_after_retries | one-in}", sub: all 3 attempts fail }
    - stat:     { label: Time per test,       value: "{sim.avg_test_ms | round} ms" }
    - run-grid: { label: "the same 200 runs, in the order CI saw them", data: sim.results }   # the plan's "test run grid"
  steps:                                      # still states: a step says what the CONTROLS are; the engine tweens them
    - say: An ordinary machine with about 3 ms of jitter. {sim.failed} of {sim.runs} runs fail. This is the test people rerun and forget.
      do: [set jitter 3, set sleep 50, set wait sleep]
    - say: A quiet laptop, 0.5 ms of jitter. {sim.failed} of {sim.runs} fail. The race is still in the code. Nothing here is slow enough to expose it.
      do: [set jitter 0.5]
    - say: A loaded CI runner, 10 ms of jitter. {sim.failed} of {sim.runs} fail. Every run used the same code.
      do: [set jitter 10]
    - say: The usual patch is a longer sleep. Still {sim.failed} of {sim.runs} fail, and now every run costs 80 ms.
      do: [set sleep 80]
    - say: Wait for the worker itself and the order is fixed. {sim.failed} failures at any jitter, and the test ends as soon as the work does.
      do: [set wait join]
  free-play:                                  # NEW: caption used once the reader touches a control (web only)
    say: "Your settings: {sim.failed} of {sim.runs} runs fail."
  check:                                      # NEW: assertions on outputs, so a seed change can't make a caption false
    - step 1: sim.failed in 3..15
    - step 2: sim.failed == 0
    - step 4: sim.failed >= 1                 # "Still N fail" must not read "Still 0 fail"
    - step 5: sim.failed == 0
    - all: abs(sim.rate - sim.expected_rate) < 0.08

# ---------------------------------------------------------------------------
# Exports. One source, three outputs.
# ---------------------------------------------------------------------------
export:                                       # NEW
  embed: [two-runs, replay]
  reel:                                       # silent 9:16, about 75 s
    size: 1080x1920
    caption: large                            # the caption is the main visual; the scene sits above it
    beats:
      - hook:    { hold: 4s }
      - scene:   { use: two-runs, per-step: 4s }
      - scene:   { use: replay, per-step: 6s, controls: show-moving, seed: 11 }   # recorded seed; sliders animate, nobody drags
      - payoff:  { hold: 5s }
